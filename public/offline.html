<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff9ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
<title>Offline | WendApply</title>
<link rel="icon" href="/icons/icon-32.png" sizes="32x32">
<style>
  :root { --paper: #fff9ef; --surface: #ffffff; --ink: #16140f; --muted: #5e584c; --line: #16140f; --brand: #385cfc; --on-brand: #ffffff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper: #15140f; --surface: #211f19; --ink: #f6f0e3; --muted: #b5ad9c; --line: #f6f0e3; --brand: #8ea2ff; --on-brand: #15140f; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); text-align: center; }
  .card { max-width: 420px; width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 32px 24px; box-shadow: 4px 4px 0 var(--line); }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.5rem; line-height: 1.2; margin: 16px 0 8px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
  button { min-height: 44px; min-width: 44px; padding: 0 24px; font: inherit; font-weight: 700; border-radius: 999px; border: 2px solid var(--line); background: var(--brand); color: var(--on-brand); cursor: pointer; box-shadow: 2px 2px 0 var(--line); }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .hint { font-size: .875rem; margin: 16px 0 0; }
</style>
</head>
<body>
<main>
  <div class="card" role="status">
    <img src="/icons/icon-192.png" alt="" width="72" height="72">
    <h1>Du bist offline</h1>
    <p>WendApply braucht eine Internetverbindung, um deine Bewerbungen zu laden. Prüfe dein WLAN oder deine mobilen Daten und versuche es nochmals.</p>
    <button type="button" id="retry">Nochmals versuchen</button>
    <p class="hint" id="status" aria-live="polite"></p>
  </div>
</main>
<script>
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  window.addEventListener("online", function () { document.getElementById("status").textContent = "Wieder online – lade neu …"; location.reload(); });
</script>
</body>
</html>
